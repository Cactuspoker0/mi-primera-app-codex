<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do App</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f1f5f9;}
    .container{max-width:480px;margin:0 auto;}
    h1{text-align:center;margin-top:0;}
    form{display:flex;gap:8px;}
    input[type=text]{flex:1;padding:12px;font-size:16px;border-radius:8px;border:1px solid #cbd5e1;}
    button{padding:12px 16px;font-size:16px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer;}
    button:active{background:#2563eb;}
    ul{list-style:none;padding:0;margin:20px 0 0;}
    li{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid #e2e8f0;}
    li.done span{ text-decoration:line-through;color:#94a3b8; }
    li button{margin-left:8px;background:#e5e7eb;color:#000;}
    li button.toggle{background:#22c55e;color:#fff;}
    li.done button.toggle{background:#a1a1aa;}
    li button.remove{background:#ef4444;color:#fff;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Mis Tareas</h1>
    <form id="todo-form">
      <input id="task-input" type="text" placeholder="Nueva tarea" required />
      <button type="submit">Agregar</button>
    </form>
    <ul id="task-list"></ul>
  </div>

  <script>
  const form=document.getElementById('todo-form');
  const input=document.getElementById('task-input');
  const list=document.getElementById('task-list');
  const tasks=JSON.parse(localStorage.getItem('tasks')||'[]');
  tasks.forEach(addTaskElement);

  form.addEventListener('submit',e=>{
    e.preventDefault();
    const text=input.value.trim();
    if(!text) return;
    const task={id:Date.now(),text,done:false};
    tasks.push(task);
    save();
    addTaskElement(task);
    input.value='';
  });

  function addTaskElement(task){
    const li=document.createElement('li');
    li.dataset.id=task.id;
    if(task.done) li.classList.add('done');
    li.innerHTML=`<span>${task.text}</span><span><button class="toggle">${task.done?'Desmarcar':'Hecha'}</button><button class="remove">Eliminar</button></span>`;
    list.appendChild(li);
  }

  list.addEventListener('click',e=>{
    const li=e.target.closest('li');
    if(!li) return;
    const id=Number(li.dataset.id);
    if(e.target.classList.contains('toggle')){
      const task=tasks.find(t=>t.id===id);
      task.done=!task.done;
      li.classList.toggle('done',task.done);
      e.target.textContent=task.done?'Desmarcar':'Hecha';
      save();
    }else if(e.target.classList.contains('remove')){
      const idx=tasks.findIndex(t=>t.id===id);
      tasks.splice(idx,1);
      li.remove();
      save();
    }
  });

  function save(){
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }
  </script>
</body>
</html>
